function ticketRows(){return cases().filter(t=>(!q||(t.subject+' '+t.id+' '+t.owner).toLowerCase().includes(q.toLowerCase()))&&(!statusFilter||(statusFilter==='overdue'?overdue(t):t.status===statusFilter))).sort((a,b)=>{let x=sortKey==='due'?a.due:sortKey==='status'?a.status:a.created,y=sortKey==='due'?b.due:sortKey==='status'?b.status:b.created;return sortDir*String(x).localeCompare(String(y))})}

function renderTickets(){const ts=ticketRows();return head('Обращения','У каждой проблемы есть ответственный, срок и история решения.',btn(icon('plus')+' Создать обращение','new-ticket','primary',!canEdit()?'disabled':''))+filters()+`<div class="row between mb"><div class="tabs" style="margin:0;border:0;padding:0"><button data-view="list" class="${ticketView==='list'?'active':''}">Список</button><button data-view="board" class="${ticketView==='board'?'active':''}" data-tour="board-button">Доска</button></div><span class="small muted">${ts.length} обращений</span></div><div class="filters">${field('Поиск','search','search',q,'data-search placeholder="Номер, тема, ответственный"')}${select('Статус','statusFilter',[['','Все статусы'],...statuses,['overdue','Просрочено']],statusFilter,'data-local="status"')}${select('Сортировка','sort',[['date','По дате создания'],['due','По сроку решения'],['status','По статусу']],sortKey,'data-sort')}${btn('Сбросить','clear','small')}</div>${!ts.length?empty():ticketView==='board'?`<div class="kanban" data-tour="board">${statuses.map(s=>`<section class="kanban-col"><h3>${s}<span>${ts.filter(t=>t.status===s).length}</span></h3>${ts.filter(t=>t.status===s).map(t=>`<button class="ticket-mini" data-ticket="${t.id}"><div class="row between"><span class="small muted">${t.id}</span>${badge(t.priority,t.priority==='Высокий'?'bad':'gray')}</div><h4>${esc(t.subject)}</h4><p>${esc(cname(t.center))}</p><p>${esc(t.owner)}</p><div class="mt">${overdue(t)?badge('Срок нарушен','bad'):badge(t.status==='Решено'?'Решено':'До '+dt(t.due),'gray')}</div></button>`).join('')}</section>`).join('')}</div>`:`<div class="card table-card"><div class="table-wrap"><table><thead><tr><th>Обращение</th><th>Центр / источник</th><th>Ответственный</th><th>Статус</th><th aria-sort="${sortKey==='due'?(sortDir===1?'ascending':'descending'):'none'}"><button data-sort-col="due">Срок решения ↕</button></th></tr></thead><tbody>${ts.map(t=>`<tr><td><button class="link" data-ticket="${t.id}">${t.id} · ${esc(t.subject)}</button><small>${date(t.created)} · ${t.priority}</small></td><td>${esc(cname(t.center))}<small>${esc(t.channel)}</small></td><td>${esc(t.owner)}</td><td>${statusBadge(t)}</td><td>${overdue(t)?badge('Просрочено','bad'):badge(t.status==='Решено'?'Завершено':'В срок','good')}<small>${dt(t.due)}</small></td></tr>`).join('')}</tbody></table></div></div>`}`}
function renderNps(){const a=records(),n=a.filter(r=>r.kind===npsKind),hist=Array.from({length:11},(_,i)=>n.filter(r=>r.nps===i).length),prom=n.filter(r=>r.nps>=9).length,pass=n.filter(r=>r.nps===7||r.nps===8).length,det=n.filter(r=>r.nps<=6).length;return head('NPS и оценки','Готовность рекомендовать, впечатление от визита и оценки отдельных ролей.',btn(icon('plus')+' Пройти анкету','preview-survey','primary',!canEdit()?'disabled':''))+filters()+`<div class="tabs" data-tour="nps-tabs"><button data-nps="visit" class="${npsKind==='visit'?'active':''}">NPS визита</button><button data-nps="product" class="${npsKind==='product'?'active':''}">NPS продукта</button><button data-nps="team" class="${npsKind==='team'?'active':''}">Администратор и косметолог</button></div>${npsKind==='team'?renderTeamScores(a):`<div class="grid two"><section class="card" data-tour="nps-distribution"><div class="card-head"><div><h2>${npsKind==='product'?'Готовность рекомендовать продукт':'Готовность рекомендовать центр'}</h2><p>${n.length} ответов · только вопрос по шкале 0–10</p></div>${badge('NPS')}</div><div class="big-value mono">${val(nps(n))}</div><p class="small muted">Диапазон показателя: от −100 до +100</p><div class="nps-strip">${[[det,'var(--danger)'],[pass,'#b39263'],[prom,'var(--brand)']].map(([c,col])=>`<span style="width:${n.length?c/n.length*100:0}%;background:${col}"></span>`).join('')}</div><div class="grid three"><div><strong>${prom}</strong><p class="small muted">Промоутеры · 9–10</p></div><div><strong>${pass}</strong><p class="small muted">Нейтральные · 7–8</p></div><div><strong>${det}</strong><p class="small muted">Критики · 0–6</p></div></div><div class="notice mt">${icon('info')}<div>${n.length?`(${prom} − ${det}) / ${n.length} × 100 = ${nps(n)} пунктов`:'Недостаточно данных для расчёта.'}<p>Малая выборка — сигнал для изучения, а не основание для рейтинга сотрудников.</p></div></div></section><section class="card"><div class="card-head"><h2>Распределение ответов</h2></div><div class="histogram">${hist.map((c,i)=>`<div class="hist-col"><span>${c}</span><button class="hist-bar" data-score-drill="${i}" aria-label="Оценка ${i}: ${c} ответов" style="height:${Math.max(2,c/Math.max(1,...hist)*130)}px;background:${i<7?'#bd6f7a':i<9?'#b39263':'var(--brand)'}"></button><span>${i}</span></div>`).join('')}</div><p class="small muted mt">Нажмите на оценку — откроются исходные ответы.</p></section></div><section class="card mt"><div class="card-head"><h2>${npsKind==='product'?'Оценки по продуктам':'Показатели по центрам'}</h2>${btn('Выгрузить ответы','export-nps','small')}</div><div class="table-wrap"><table><thead><tr><th>${npsKind==='product'?'Продукт':'Центр'}</th><th>Ответов</th><th>Промоутеры</th><th>Критики</th><th>NPS</th><th>Выборка</th></tr></thead><tbody>${(npsKind==='product'?products:centers).map(c=>{const rows=n.filter(r=>npsKind==='product'?r.product===c.id:r.center===c.id);return rows.length?`<tr><td>${esc(c.name)}</td><td>${rows.length}</td><td>${rows.filter(r=>r.nps>=9).length}</td><td>${rows.filter(r=>r.nps<=6).length}</td><td><strong>${val(nps(rows))}</strong></td><td>${badge(rows.length<30?'Менее 30 ответов':'30+ ответов',rows.length<30?'warn':'good')}</td></tr>`:''}).join('')}</tbody></table></div></section>`}`}
function renderTeamScores(a){const rows=a.filter(r=>r.kind==='visit');return `<div class="notice mb">${icon('info')}<div><strong>Оценки ролей — отдельная шкала 1–5</strong><p>Они не являются NPS. Общий опыт визита сохраняется отдельно. Все сотрудники и назначение смен в прототипе вымышлены.</p></div></div><div class="card table-card"><div class="table-wrap"><table><thead><tr><th>Центр</th><th>Администратор</th><th>Косметолог</th><th>Ответов</th><th>NPS визита</th></tr></thead><tbody>${centers.map((c,i)=>{const rs=rows.filter(r=>r.center===c.id);return rs.length?`<tr><td><button class="link" data-location="${c.id}">${esc(c.name)}</button></td><td>${val(mean(rs.map(r=>r.admin).filter(Number.isFinite)),' / 5')}<small>Администратор ${i+1} · демо</small></td><td>${val(mean(rs.map(r=>r.expert).filter(Number.isFinite)),' / 5')}<small>Косметолог ${i+1} · демо</small></td><td>${rs.length}</td><td>${val(nps(rs))}</td></tr>`:''}).join('')}</tbody></table></div></div>`}
function renderJourney(){const a=records(),ms=checks().filter(x=>x.validated);return head('Клиентский путь','Проверки стандартов и голос клиента — рядом, с сохранением методики каждого источника.',btn('План улучшений','go-overview'))+filters()+`<div class="notice mb">${icon('path')}<div><strong>Один визит — общая ответственность команды</strong><p>Сопоставление по этапу, центру и периоду. Оценки тайных покупателей не добавляются в NPS. Фильтр источника влияет только на отзывы.</p></div></div><div class="grid two"><section class="card" data-tour="journey"><div class="card-head"><h2>Где теряется качество опыта</h2>${badge(ms.length+' проверок')}</div><div class="progress-steps">${stages.map((s,i)=>{const score=mean(ms.map(m=>m.scores[i]));return `<div class="stage"><span class="stage-num">${String(i+1).padStart(2,'0')}</span><button class="link" data-stage="${i}">${s}</button><div class="bar-track"><div class="bar-fill" style="width:${score||0}%;background:${score<80?'#b39263':'var(--brand)'}"></div></div><strong>${score===null?'—':Math.round(score)+'%'}</strong></div>`}).join('')}</div><p class="small muted mt">Процент выполнения стандарта по валидированным проверкам.</p></section><section class="card"><div class="card-head"><h2>Что говорят реальные клиенты</h2></div>${stages.map(s=>({s,n:a.filter(r=>r.stage===s&&negative(r)).length})).filter(x=>x.n).sort((x,y)=>y.n-x.n).slice(0,5).map(x=>`<div class="checkbox-row"><div><strong style="font-size:12px">${x.s}</strong><p>${x.n} низких оценок с этой темой</p></div><button class="btn small" data-stage="${stages.indexOf(x.s)}">Разобрать</button></div>`).join('')||'<p class="muted">Нет низких оценок.</p>'}<div class="notice mt">${icon('spark')}<div>Гипотеза для проверки: информирование об ожидании может улучшить опыт до консультации. Создайте действие и проверьте динамику.</div></div>${btn(icon('plus')+' Создать действие','new-action','soft mt',!canEdit()?'disabled':'')}</section></div>`}
function renderMystery(){const ms=checks().filter(m=>!q||(m.id+' '+cname(m.center)+' '+m.scenario).toLowerCase().includes(q.toLowerCase())),valid=ms.filter(x=>x.validated);return head('Тайный покупатель','Единый визит: запись, администратор, косметолог и завершение контакта.',btn(icon('plus')+' Добавить проверку','new-check','primary',!canEdit()?'disabled':''))+filters()+`<div class="notice mb">${icon('info')}<div>Фильтр источника не применяется к проверкам. Здесь учитываются локация и период. Сценарии и результаты полностью синтетические.</div></div><div class="grid kpis">${metric('Проверок',ms.length,'В выбранном периоде','mystery-all',true,'eye')}${metric('Выполнение стандартов',val(valid.length?Math.round(mean(valid.map(totalScore))):null,'%'),'Только валидированные проверки','mystery-all')}${metric('На валидации',ms.length-valid.length,'Проверка качества материалов','mystery-pending',false,'shield')}${metric('Сценариев',new Set(ms.map(m=>m.scenario)).size,'Сайт, телефон, без записи, ожидание','mystery-all',false,'path')}</div><div class="card table-card" data-tour="mystery-table"><div class="table-wrap"><table><thead><tr><th>Проверка</th><th>Центр</th><th>Сценарий</th><th>Результат</th><th>Валидация</th></tr></thead><tbody>${ms.map(m=>`<tr><td><button class="link" data-check="${m.id}">${m.id}</button><small>${date(m.date)}</small></td><td>${esc(cname(m.center))}</td><td>${esc(m.scenario)}</td><td>${totalScore(m)}%</td><td>${badge(m.validated?'Проверено':'На валидации',m.validated?'good':'warn')}</td></tr>`).join('')}</tbody></table></div></div>`}

><div class="row mt" style="justify-content:center">${btn(icon('down')+' Скачать SVG','download-qr')}${btn('Открыть анкету','preview-survey','soft')}</div><div class="notice mt">${icon('info')}<div>Ответ на тестовую анкету появится в обратной связи и пересчитает NPS. Низкая оценка может создать обращение по правилу.</div></div></section></div>`}

function reportHTML(){const a=records(),ts=cases(),n=a.filter(r=>r.kind==='visit'),m=checks().filter(x=>x.validated);return `<div class="report-preview" data-tour="report"><div class="eyebrow">GELTEK × СПЕКТРА / ДЕМОНСТРАЦИОННЫЙ ОТЧЁТ</div><h2>Клиентский опыт: результаты периода</h2><p class="muted small mt">${scopeCenter()?esc(cname(scopeCenter())):'Все локации'} · ${F.channel||'Все источники'} · последние ${F.period} дней до ${date(S.now)}</p><div class="grid kpis"><div><span class="small muted">Обратная связь</span><div class="kpi-number">${a.length}</div></div><div><span class="small muted">NPS визита</span><div class="kpi-number">${val(nps(n))}</div><span class="small muted">${n.length} ответов</span></div><div><span class="small muted">Открыто обращений</span><div class="kpi-number">${ts.filter(t=>t.status!=='Решено').length}</div></div><div><span class="small muted">Соблюдение SLA</span><div class="kpi-number">${val(sla(ts),'%')}</div></div></div><h3>Наблюдения и действия</h3><ul class="summary-list"><li>Получено ${a.filter(negative).length} низких оценок. ${ts.filter(overdue).length} обращений просрочено.</li><li>Тайный покупатель: ${m.length} валидированных проверок; выполнение стандартов ${val(m.length?Math.round(mean(m.map(totalScore))):null,'%')}. Фильтр источника на проверки не влияет.</li><li>Рекомендуем разобрать повторяющиеся причины и проверить изменения в следующем периоде.</li></ul><h3>Причины низких оценок</h3>${themeBars(a)}<h3>План улучшений</h3><ul class="summary-list">${S.actions.filter(x=>!scopeCenter()||x.center===scopeCenter()).map(x=>`<li>${esc(x.title)} · ${esc(x.owner)} · ${x.due} · ${x.done?'выполнено':'в работе'}</li>`).join('')||'<li>Действия ещё не назначены.</li>'}</ul><p class="small muted mt">Все данные вымышлены. Показатели иллюстрируют работу системы и не отражают фактическое качество сервиса Гельтек.</p></div>`}
function renderReports(){return head('Отчёты для руководства','Проверьте исходные данные, выгрузите таблицу или сохраните печатный отчёт.',btn(icon('down')+' CSV для Excel','export-feedback')+btn('Презентация HTML','export-slides')+btn(icon('doc')+' Печать / PDF','print-report','primary'))+filters()+reportHTML()+`<div class="notice mt">${icon('info')}<div>CSV открывается в Excel и содержит текущую выборку. Печать позволяет сохранить PDF через диалог браузера. Презентация скачивается как отдельный HTML с навигацией по слайдам; открывается без интернета.</div></div>`}
function renderSettings(){return head('Настройки системы','Правила обработки, сроки реакции, шаблоны и управление демонстрацией.')+`<div class="notice mb">${icon('shield')}<div><strong>${isAdmin()?'Вы управляете настройками демонстрации':'Настройки доступны для просмотра'}</strong><p>Переключение ролей показывает сценарии доступа. Это локальный прототип, а не защищённая многопользовательская система.</p></div></div><div class="grid half"><section class="card" data-tour="rules"><div class="card-head"><h2>Правила обработки</h2></div><form id="rulesForm">${[['autoNegative','Создавать обращение при низкой оценке','NPS 0–6 или рейтинг 1–2 из 5.'],['autoPositive','Автоответ на позитив','Только рейтинг 5/5 или NPS 9–10. Ответ остаётся внутри демо.'],['escalation','Эскалировать просроченные обращения','Уведомление руководителю в журнале событий.']].map(([k,label,help])=>`<div class="checkbox-row"><div><strong style="font-size:12px">${label}</strong><p>${help}</p></div><input type="checkbox" aria-label="${label}" name="${k}" ${S.settings[k]?'checked':''} ${!isAdmin()?'disabled':''}></div>`).join('')}<div class="form-grid mt">${field('Высокий приоритет · часы','highHours','number',S.settings.highHours,'min="1" max="168" required '+(!isAdmin()?'disabled':''))}${field('Обычный приоритет · часы','normalHours','number',S.settings.normalHours,'min="1" max="720" required '+(!isAdmin()?'disabled':''))}</div><p class="small muted mt">В демо сроки считаются в календарных часах. Новые значения применяются к новым обращениям.</p><div class="form-actions">${btn('Сохранить правила','save-rules','primary',!isAdmin()?'disabled':'')}</div></form></section><section class="card"><div class="card-head"><h2>Шаблоны ответов</h2></div><form id="templatesForm"><label class="field"><span>Благодарность за позитив</span><textarea id="positiveTemplate" required maxlength="1500" ${!isAdmin()?'disabled':''}>${esc(S.settings.positiveTemplate)}</textarea></label><label class="field mt"><span>Первый ответ на негатив</span><textarea id="negTemplate" required maxlength="1500" ${!isAdmin()?'disabled':''}>${esc(S.settings.negTemplate)}</textarea></label><div class="form-actions">${btn('Сохранить шаблоны','save-templates','primary',!isAdmin()?'disabled':'')}</div></form></section></div><div class="grid half mt"><section class="card" data-tour="demo-time"><div class="card-head"><h2>Демонстрационное время</h2>${badge(dt(S.now))}</div><p class="small muted">Продвиньте время на 24 часа, чтобы проверить просрочки и эскалации. Данные сохраняются в этом браузере.</p><div class="row mt">${btn('+24 часа','advance-time','soft',!isAdmin()?'disabled':'')}${btn('Журнал событий','show-logs')}</div></section><section class="card"><div class="card-head"><h2>Сохранение и восстановление</h2></div><p class="small muted">Скачайте состояние прототипа перед демонстрацией. Сброс восстанавливает исходные синтетические данные.</p><div class="row mt">${btn('Резервная копия JSON','backup')}${btn('Сбросить демо','reset','danger',!isAdmin()?'disabled':'')}</div><label class="field mt"><span>Восстановить резервную копию этого прототипа</span><input class="file-input" type="file" id="restoreFile" accept=".json,application/json" ${!isAdmin()?'disabled':''}></label></section></div><section class="card mt"><h2>Этапы запуска</h2><div class="mt"><div class="launch-step"><h3>1. QR и первый управленческий результат</h3><p>Анкета, справочники, привязка к ролям, базовые отчёты и порядок реакции.</p></div><div class="launch-step"><h3>2. Сайт, почта и VK</h3><p>Единая классификация, ответственные, сроки и согласованные шаблоны.</p></div><div class="launch-step"><h3>3. Telegram, маркетплейсы и расширенная аналитика</h3><p>Сложные источники, SKU, сопоставление данных и развитие отчётности.</p></div></div><p class="small muted">Предлагаемый порядок QR-first. Стоимость, сроки, интеграции, права и состав отчётов фиксируются отдельно в ТЗ и договоре.</p></section>`}
function openModal(title,body,{drawer=false,sub=''}={}){returnFocus=document.activeElement;const root=$('#tourRoot');if(root?.parentElement===$('#dialog'))document.body.append(root);const d=$('#dialog');d.className='dialog'+(drawer?' drawer':'');d.innerHTML=`<div class="dialog-head"><div><h2 id="dialogTitle">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="btn icon-only" data-action="close" aria-label="Закрыть окно">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;if(!d.open)d.showModal();d.scrollTop=0;setTimeout(()=>{if(!tourActive) d.querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),button')?.focus({preventScroll:true})},0)}
function closeModal(){const d=$('#dialog');if(!d)return;if($('#tourRoot')?.parentElement===d)detachTourPanel();if(d.open)d.close();if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});modalType=''}
function historyHTML(h){return `<div class="timeline">${h.slice().reverse().map(e=>`<div class="event"><time>${dt(e.at)}</time><strong>${esc(e.title)}</strong><p>${esc(e.text||'')}</p></div>`).join('')}</div>`}
function feedbackModal(id){const r=S.feedback.find(x=>x.id===id);if(!r||isManager()&&r.center!=='C01')return;activeId=id;modalType='feedback';const linked=S.tickets.find(t=>t.feedback===id);openModal('Обратная связь '+r.id,`<div class="row">${badge(r.channel)}${badge(r.nps!==null?'NPS '+r.nps+'/10':'Оценка '+r.rating+'/5',negative(r)?'bad':'good')}${badge(r.status,'gray')}</div><div class="quote">${esc(r.text)}</div><div class="info-grid"><div><span>Клиент</span><strong>${esc(r.name)}</strong></div><div><span>Локация</span><strong>${esc(cname(r.center))}</strong></div><div><span>Дата</span><strong>${dt(r.date)}</strong></div><div><span>Этап пути</span><strong>${esc(r.stage)}</strong></div><div><span>Продукт</span><strong>${esc(pname(r.product))}</strong></div><div><span>Роли</span><strong>${r.admin!==null?'Адм. '+r.admin+' / Косм. '+r.expert:'Не оценивались'}</strong></div></div><h3>Темы и обработка</h3><form id="feedbackTags"><div class="check-group">${themes.map(t=>`<label class="check"><input type="checkbox" name="theme" value="${esc(t)}" ${r.tags.includes(t)?'checked':''} ${!canEdit()?'disabled':''}>${t}</label>`).join('')}</div><div class="row mt">${btn('Сохранить темы','save-tags','small',!canEdit()?'disabled':'')}${btn('Разобрано','mark-reviewed','small',!canEdit()?'disabled':'')}${linked?`<button class="btn soft" data-ticket="${linked.id}" data-tour="create-from-feedback">Открыть ${linked.id}</button>`:btn(icon('plus')+' Создать обращение','ticket-from-feedback','primary','data-tour="create-from-feedback" '+(!canEdit()?'disabled':''))}</div></form><h3>Ответ клиенту</h3><p class="small muted">Шаблонная имитация ИИ-подсказки. Проверьте текст перед сохранением. Сообщения не отправляются.</p><label class="field mt"><span>Текст ответа</span><textarea id="replyText" maxlength="3000" ${!canEdit()?'disabled':''}>${esc(r.reply)}</textarea></label><div class="row mt">${btn(icon('spark')+' Подготовить ответ','ai-reply','soft','data-tour="ai-reply" '+(!canEdit()?'disabled':''))}${btn('Сохранить демо-ответ','save-reply','primary',!canEdit()?'disabled':'')}</div><h3>История</h3>${historyHTML(r.history)}`,{drawer:true,sub:'Все действия сохраняются только в прототипе.'});modalType='feedback'}
function ticketForm(feedbackId=''){const r=S.feedback.find(x=>x.id===feedbackId);activeId=feedbackId;openModal('Новое обращение',`<form id="ticketCreate"><div class="form-grid">${field('Тема обращения','ticketSubject','text',r?r.tags[0]+': '+r.text.slice(0,90):'','required maxlength="180"')}${select('Центр','ticketCenter',centers.filter(c=>!isManager()||c.id==='C01').map(c=>[c.id,c.name]),r?.center||scopeCenter()||'C01')}${select('Ответственный','ticketOwner',owners,centers.find(c=>c.id===r?.center)?.owner||owners[0])}${select('Приоритет','ticketPriority',['Обычный','Высокий'],r&&negative(r)?'Высокий':'Обычный')}<label class="field full"><span>Описание</span><textarea id="ticketDescription" required maxlength="3000">${esc(r?.text||'')}</textarea></label></div><div class="notice">${icon('clock')}<div>Срок: ${S.settings.highHours} ч для высокого приоритета, ${S.settings.normalHours} ч для обычного. Будет рассчитан от демонстрационного времени.</div></div><div class="form-actions">${btn('Отмена','close')}${btn('Создать обращение','save-new-ticket','primary','data-tour="save-ticket"')}</div></form>`,{sub:feedbackId?'Связано с обратной связью '+feedbackId:'Ручная регистрация'});modalType='new-ticket'}
function createTicket(r,subject='',owner='',priority='Высокий'){if(r){const existing=S.tickets.find(t=>t.feedback===r.id);if(existing)return existing}const id='T'+String(Math.max(0,...S.tickets.map(t=>Number(t.id.slice(1))||0))+1).padStart(3,'0'),c=r?.center||scopeCenter()||'C01';const t={id,feedback:r?.id||null,subject:subject||r?.tags[0]+': '+r?.text.slice(0,90),center:c,channel:r?.channel||'Ручной ввод',priority,owner:owner||centers.find(x=>x.id===c)?.owner||owners[0],status:'Новое',created:S.now,due:new Date(Date.parse(S.now)+(priority==='Высокий'?S.settings.highHours:S.settings.normalHours)*3600000).toISOString(),resolved:null,resolution:'',messages:[],repeat:null,history:[{at:S.now,title:'Обращение создано',text:r?'Из отзыва '+r.id:'Ручная регистрация'}]};S.tickets.unshift(t);log('Создано обращение '+id,'Ответственный: '+t.owner);return t}
function ticketModal(id){const t=S.tickets.find(x=>x.id===id);if(!t||isManager()&&t.center!=='C01')return;activeId=id;const r=S.feedback.find(x=>x.id===t.feedback);openModal(t.id+' · '+esc(t.subject),`<div class="row">${statusBadge(t)}${badge(t.priority,t.priority==='Высокий'?'bad':'gray')}${badge(overdue(t)?'Срок нарушен':'До '+dt(t.due),overdue(t)?'bad':'gray')}</div>${r?`<div class="quote">${esc(r.text)}</div><button class="link" data-feedback="${r.id}">Исходная обратная связь ${r.id} →</button>`:''}<div class="info-grid"><div><span>Локация</span><strong>${esc(cname(t.center))}</strong></div><div><span>Источник</span><strong>${esc(t.channel)}</strong></div><div><span>Создано</span><strong>${dt(t.created)}</strong></div></div><h3>Работа с обращением</h3><form id="ticketEdit"><div class="form-grid">${select('Ответственный','editOwner',owners,t.owner,!canEdit()?'disabled':'')}${select('Статус','editStatus',statuses,t.status,!canEdit()?'disabled':'')}${select('Приоритет','editPriority',['Обычный','Высокий'],t.priority,!canEdit()?'disabled':'')}${field('Срок решения (демо, UTC)','editDue','datetime-local',t.due.slice(0,16),!canEdit()?'disabled':'')}<label class="field full"><span>Что сделано / решение</span><textarea id="resolution" maxlength="3000" placeholder="Для статуса «Решено» опишите результат" ${!canEdit()?'disabled':''}>${esc(t.resolution)}</textarea><span class="error" id="resolutionError"></span></label></div><div class="form-actions">${btn('Сохранить изменения','save-ticket','primary','data-tour="ticket-save" '+(!canEdit()?'disabled':''))}</div></form><h3>Переписка и заметки</h3><div data-tour="messages">${t.messages.length?t.messages.map(m=>`<div class="message">${esc(m.text)}<small>${dt(m.at)} · ${esc(m.kind)} · только в демо</small></div>`).join(''):'<p class="small muted">Сообщений пока нет.</p>'}</div><label class="field mt"><span>Сообщение</span><textarea id="ticketMessage" maxlength="3000" ${!canEdit()?'disabled':''}></textarea></label><div class="row mt">${btn('Добавить внутреннюю заметку','add-note','',!canEdit()?'disabled':'')}${btn('Демо-ответ клиенту','ticket-reply','soft',!canEdit()?'disabled':'')}</div><h3>Проверить результат решения</h3><div class="notice">${icon('info')}<div>Повторная оценка решения — шкала 1–5. При ответе 1–2 обращение вернётся в работу. Она не меняет исходный NPS визита.</div></div><div class="row">${btn('Повторный опрос','repeat-survey','soft','data-tour="repeat" '+(t.status!=='Решено'||!canEdit()?'disabled':''))}${t.repeat?badge('Оценка решения: '+t.repeat+'/5',t.repeat<=2?'bad':'good'):''}</div><h3>История обращения</h3>${historyHTML(t.history)}`,{drawer:true,sub:'Сохранение, сообщения и повторный опрос — локальные действия.'});modalType='ticket'}
function previewSurvey(productMode=false){if(!S.channels.QR.enabled){toast('Источник QR приостановлен. Включите его в разделе «Источники».');return}if(!S.survey.active){toast('Приём ответов приостановлен. Включите анкету в настройках.');return}const c=$('#qrCenter')?.value||scopeCenter()||'C01';openModal('Пример анкеты клиента',`<form id="responseForm"><div class="phone" data-tour="survey-form"><img class="phone-logo" src="${LOGO}" alt="Гельтек"><div class="eyebrow">${productMode?'После использования продукта':'После визита в центр'}</div><h2>${productMode?'Как вам наш продукт?':esc(S.survey.title)}</h2><p class="mt">${esc(S.survey.intro)}</p>${select('Центр','responseCenter',centers.filter(x=>x.type==='ЦДК'&&(!isManager()||x.id==='C01')).map(x=>[x.id,x.name]),c)}${select('Что оцениваем','responseKind',[['visit','Опыт визита'],['product','Опыт использования продукта']],productMode?'product':'visit')}${select('Продукт (для оценки продукта)','responseProduct',products.map(p=>[p.id,p.name]),products[0].id)}<div class="field"><span id="npsQuestion">${esc(S.survey.questions[0])}</span><div class="rating" role="group" aria-labelledby="npsQuestion">${Array.from({length:11},(_,i)=>`<button type="button" data-rating="${i}" aria-pressed="false" aria-label="${i} из 10">${i}</button>`).join('')}</div><input type="hidden" id="responseNps"><div class="row between small muted"><span>Совсем не вероятно</span><span>Очень вероятно</span></div><span id="npsError" class="error"></span></div>${select(S.survey.questions[1],'responseAdmin',[['','Выберите оценку'],...Array.from({length:5},(_,i)=>[String(i+1),String(i+1)+' / 5'])],'','required')}${select(S.survey.questions[2],'responseExpert',[['','Выберите оценку'],...Array.from({length:5},(_,i)=>[String(i+1),String(i+1)+' / 5'])],'','required')}<label class="field"><span>${esc(S.survey.questions[3])}</span><textarea id="responseText" maxlength="2000" placeholder="Расскажите о своём опыте"></textarea></label><div class="mt">${btn('Отправить тестовый ответ','submit-survey','primary','style="width:100%" data-tour="submit-survey" '+(!canEdit()?'disabled':''))}</div><p class="small mt">Ответ останется в этой демонстрации. Контактные данные не запрашиваются.</p></div></form>`,{sub:'Результат попадёт в обратную связь и аналитику.'});modalType='survey';if(productMode){$('#responseAdmin').disabled=true;$('#responseExpert').disabled=true;$('#responseAdmin').required=false;$('#responseExpert').required=false;$('#npsQuestion').textContent='Насколько вероятно, что вы порекомендуете этот продукт Гельтек?'}}
function addFeedback(r){r.tags=[...new Set([...r.tags,...classify(r.text)])];S.feedback.unshift(r);if(S.settings.autoNegative&&negative(r))createTicket(r);if(S.settings.autoPositive&&(r.nps>=9||r.rating===5)){r.reply=S.settings.positiveTemplate;r.status='Ответ подготовлен';r.history.push({at:S.now,title:'Автоответ подготовлен',text:'Локальная имитация по шаблону'})}log('Получена обратная связь '+r.id,r.channel);save()}
function newFeedback(){openModal('Добавить обратную связь',`<form id="newFeedbackForm"><div class="form-grid">${select('Источник','newSource',channels.map(c=>c[0]),'Email')}${select('Центр','newCenter',centers.filter(c=>!isManager()||c.id==='C01').map(c=>[c.id,c.name]),scopeCenter()||'C01')}${select('Оценка / 5','newRating',['1','2','3','4','5'],'2')}${select('Тема','newTheme',themes,'Сервис')}<label class="field full"><span>Текст отзыва</span><textarea id="newText" required maxlength="2000"></textarea></label></div><div class="form-actions">${btn('Отмена','close')}${btn('Сохранить отзыв','save-feedback','primary')}</div></form>`)}
function actionForm(stage=''){openModal('Действие по улучшению сервиса',`<form id="actionForm"><div class="form-grid"><div class="full">${field('Что нужно сделать','actionTitle','text',stage?'Разобрать этап «'+stage+'»':'','required maxlength="180"')}</div>${select('Центр','actionCenter',centers.filter(c=>!isManager()||c.id==='C01').map(c=>[c.id,c.name]),scopeCenter()||'C01')}${select('Ответственный','actionOwner',owners,owners[0])}${field('Срок','actionDue','date','2026-11-18','required')}</div><div class="form-actions">${btn('Отмена','close')}${btn('Добавить в план','save-action','primary')}</div></form>`)}
function checkModal(id){const m=S.mystery.find(x=>x.id===id);if(!m||isManager()&&m.center!=='C01')return;activeId=id;openModal('Проверка '+m.id,`<div class="row">${badge(m.scenario)}${badge(m.validated?'Валидировано':'На проверке',m.validated?'good':'warn')}</div><p class="small muted mt">${esc(cname(m.center))} · ${date(m.date)}</p><div class="quote">${esc(m.note)}</div><h3>Оценка этапов визита</h3>${m.scores.map((v,i)=>`<div class="checklist-item"><span>${stages[i]}</span><strong>${v}%</strong></div>`).join('')}<div class="stat-pair"><div><strong>${Math.round(mean(m.scores.slice(0,5)))}%</strong><span>Запись и администраторы</span></div><div><strong>${Math.round(mean(m.scores.slice(5)))}%</strong><span>Консультация и завершение</span></div></div><p class="small muted">Итог ${totalScore(m)}% — среднее по этапам с равными весами. Промышленная методика и веса согласуются отдельно.</p><div class="row mt">${!m.validated?btn('Подтвердить валидацию','validate-check','primary',!canEdit()?'disabled':''):''}${btn('Создать действие','new-action','soft',!canEdit()?'disabled':'')}${btn('Материалы проверки','check-materials')}</div>`,{drawer:true});modalType='check'}
function newCheck(){openModal('Новая проверка тайного покупателя',`<form id="checkForm"><div class="form-grid">${select('Центр','checkCenter',centers.filter(c=>!isManager()||c.id==='C01').map(c=>[c.id,c.name]),scopeCenter()||'C01')}${select('Сценарий','checkScenario',['Запись через сайт','Телефонная запись','Визит без записи','Лист ожидания'],'Запись через сайт')}${stages.map((s,i)=>field(s+' · %','checkScore'+i,'number',80,'min="0" max="100" required')).join('')}<label class="field full"><span>Наблюдение</span><textarea id="checkNote" required maxlength="2000"></textarea></label></div><div class="form-actions">${btn('Добавить на валидацию','save-check','primary')}</div></form>`)}
function locationModal(id){const c=centers.find(x=>x.id===id);if(!c||isManager()&&id!=='C01')return;const rs=records().filter(r=>r.center===id),visits=rs.filter(r=>r.kind==='visit');activeId=id;openModal(esc(c.name),`<div class="row">${badge(c.type)}${badge(c.legal,'gray')}</div><div class="info-grid"><div><span>Ответственный</span><strong>${c.owner}</strong></div><div><span>Обратная связь</span><strong>${rs.length} записей</strong></div><div><span>NPS визита</span><strong>${val(nps(visits))} · n=${visits.length}</strong></div></div><h3>Команда и график · пример</h3><table><thead><tr><th>Роль</th><th>Сотрудник</th><th>График</th><th>Оценка</th></tr></thead><tbody><tr><td>Администратор</td><td>Сотрудник А · демо</td><td>10:00–19:00</td><td>${val(mean(visits.map(r=>r.admin).filter(Number.isFinite)),' / 5')}</td></tr><tr><td>Косметолог</td><td>Сотрудник Б · демо</td><td>10:00–19:00</td><td>${val(mean(visits.map(r=>r.expert).filter(Number.isFinite)),' / 5')}</td></tr></tbody></table><h3>Последняя обратная связь</h3>${rs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(r=>`<div class="quote"><p>${esc(r.text)}</p><button class="link mt" data-feedback="${r.id}">${r.id} →</button></div>`).join('')||'<p class="muted">Нет записей в выбранном периоде.</p>'}<div class="form-actions">${btn('Показать аналитику центра','filter-location','primary')}</div>`,{drawer:true})}
function stageModal(i){const s=stages[i],ms=checks().filter(x=>x.validated),rs=records().filter(r=>r.stage===s);openModal('Этап: '+s,`<div class="stat-pair"><div><strong>${val(ms.length?Math.round(mean(ms.map(m=>m.scores[i]))):null,'%')}</strong><span>Выполнение стандарта · ${ms.length} проверок</span></div><div><strong>${rs.filter(negative).length}</strong><span>Низких оценок реальных клиентов</span></div></div><p class="small muted">Сравнение по выбранным центрам и периоду. Совпадение сигналов — основание проверить причину, а не доказательство причинности.</p><h3>Исходные отзывы</h3>${rs.slice(0,6).map(r=>`<div class="quote">${esc(r.text)}<br><button class="link mt" data-feedback="${r.id}">${r.id} →</button></div>`).join('')||'<p class="muted">Нет отзывов по этому этапу.</p>'}<button class="btn primary mt" data-action="new-action" data-stage-name="${esc(s)}" ${!canEdit()?'disabled':''}>Создать действие</button>`,{drawer:true})}
function productModal(id){const p=products.find(x=>x.id===id),rs=records().filter(r=>r.product===id);openModal(esc(p.name),`<div class="row">${badge(p.sku)}${badge('Демонстрационный SKU','gray')}</div><div class="stat-pair"><div><strong>${val(mean(rs.map(r=>r.rating).filter(Number.isFinite)),' / 5')}</strong><span>Рейтинг отзывов</span></div><div><strong>${val(nps(rs.filter(r=>r.kind==='product')))}</strong><span>NPS после использования</span></div></div>${rs.slice(0,12).map(r=>`<div class="quote"><div class="row mb">${badge(r.channel)}${badge(r.nps!==null?'NPS '+r.nps:r.rating+'/5',negative(r)?'bad':'good')}</div>${esc(r.text)}<br><button class="link mt" data-feedback="${r.id}">Открыть ${r.id} →</button></div>`).join('')||'<p class="muted">Нет ответов по выбранным фильтрам.</p>'}`,{drawer:true})}
function channelModal(id){const c=S.channels[id];activeId=id;openModal('Источник: '+esc(id),`<form id="channelForm">${field('Название подключения','channelAccount','text',c.account,'required maxlength="150"')}<label class="check mt"><input id="channelEnabled" type="checkbox" ${c.enabled?'checked':''}>Принимать новые демонстрационные записи</label><div class="notice">${icon('info')}<div>Внешнее подключение не выполняется. API, доступы, частота обновления и состав данных согласуются при внедрении.</div></div><div class="form-actions">${btn('Имитировать синхронизацию','sync-channel','soft')}${btn('Сохранить','save-channel','primary')}</div></form>`)}
function showLogs(){openModal('Журнал событий',`<div class="notice">${icon('info')}<div>Только локальные события прототипа. Ни один ответ не отправлен клиенту или во внешнюю систему.</div></div>${historyHTML(S.logs.slice(0,80).reverse())}`,{drawer:true})}

function classify(text){const rules=[['Запись и ожидание',/ожидан|ждал|запис|задерж/i],['Консультация',/консультац|косметолог|рекомендац/i],['Продукт',/продукт|средств|дозатор|текстур|сыворот/i],['Доставка',/достав|заказ|упаковк/i],['Сайт',/сайт|форм[аыу]/i],['Благодарность',/спасибо|благодар/i]];return rules.filter(([t,re])=>re.test(text)).map(([t])=>t)}
function exportSlides(){const a=records(),ts=cases(),n=a.filter(r=>r.kind==='visit'),m=checks().filter(x=>x.validated),ca=themes.map(t=>({t,n:a.filter(r=>negative(r)&&r.tags.includes(t)).length})).filter(x=>x.n).sort((x,y)=>y.n-x.n).slice(0,5);const slides=[
`<span class="over">GELTEK × СПЕКТРА</span><h1>Клиентский опыт:<br>от обратной связи<br>к действию</h1><p>${scopeCenter()?esc(cname(scopeCenter())):'Все локации'} · ${esc(F.channel||'Все источники')}<br>Последние ${F.period} дней до ${date(S.now)}</p><div class="note">Демонстрационный отчёт · все данные синтетические</div>`,

`<span class="over">03 / ПЛАН УЛУЧШЕНИЙ</span><h1>Следующий шаг —<br>конкретное действие</h1><ul>${S.actions.filter(x=>!scopeCenter()||x.center===scopeCenter()).slice(0,5).map(x=>`<li>${esc(x.title)}<small>${esc(x.owner)} · ${esc(x.due)} · ${x.done?'Выполнено':'В работе'}</small></li>`).join('')||'<li>Назначить ответственных за ключевые причины жалоб</li>'}</ul><div class="note">Проверить результат на следующей волне обратной связи. NPS, рейтинг и оценка стандартов сохраняют отдельную методику.</div>`];
const html='<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гельтек — отчёт по клиентскому опыту</title><style>body{margin:0;background:#f6f6f9;color:#252638;font:18px/1.5 Arial,sans-serif}*{box-sizing:border-box}.slide{display:none;min-height:100vh;padding:7vh 9vw 100px}.slide.active{display:block}.over{font-size:13px;letter-spacing:3px;color:#5f6db2}h1{font-size:clamp(32px,5vw,68px);line-height:1.12;font-weight:500;letter-spacing:-2px;margin:36px 0}p{color:#646579;max-width:850px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:50px}.metrics div{padding:25px;background:#fff;border:1px solid #e4e4ed;border-radius:18px}.metrics b{display:block;font-size:48px;color:#5f6db2}.metrics span{font-size:15px}ul{list-style:none;padding:0;max-width:900px}li{border-bottom:1px solid #dddde8;padding:15px 0;font-size:20px}li strong{float:right;color:#5f6db2}small{display:block;color:#646579;font-size:14px;margin-top:7px}.note{margin-top:32px;padding:20px;background:#eff0fa;color:#465393;border-radius:14px;font-size:15px;max-width:900px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:20px;align-items:center;background:white;border-top:1px solid #e4e4ed;padding:16px}button{background:#5f6db2;color:white;border:0;padding:12px 22px;border-radius:9px;cursor:pointer}button:focus-visible{outline:3px solid #252638;outline-offset:3px}button:disabled{opacity:.4}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}.slide{padding:35px 20px 100px}h1{letter-spacing:-1px}.metrics b{font-size:32px}.metrics div{padding:16px}nav{gap:12px}}@media print{.slide{display:block!important;break-after:page;min-height:0;height:100vh}nav{display:none}}</style>'+slides.map((s,i)=>'<section class="slide '+(i===0?'active':'')+'">'+s+'</section>').join('')+'<nav><button id="prev">Назад</button><span id="counter">1 / 4</span><button id="next">Далее</button></nav><script>let i=0;const s=[...document.querySelectorAll(".slide")];function show(){s.forEach((e,n)=>e.classList.toggle("active",n===i));document.getElementById("counter").textContent=(i+1)+" / "+s.length;document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===s.length-1}document.getElementById("prev").onclick=()=>{i=Math.max(0,i-1);show()};document.getElementById("next").onclick=()=>{i=Math.min(s.length-1,i+1);show()};document.onkeydown=e=>{if(e.key==="ArrowRight"){i=Math.min(s.length-1,i+1);show()}if(e.key==="ArrowLeft"){i=Math.max(0,i-1);show()}};show();<'+ '/script></html>';download('Гельтек_отчёт_презентация.html',html,'text/html;charset=utf-8');toast('Презентация из четырёх слайдов сохранена')}

function download(name,content,type='text/plain;charset=utf-8'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csv(name,headers,rows){const cell=x=>{let s=String(x??'');if(/^[=+@\-]/.test(s)&&typeof x!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download(name,'\ufeff'+[headers,...rows].map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV сохранён. Откройте его в Excel.')}
function exportRecords(a,name='geltek-feedback.csv'){csv(name,['ID','Дата','Локация','Источник','Объект NPS','NPS 0–10','Рейтинг 1–5','Администратор 1–5','Косметолог 1–5','SKU','Темы','Текст','Статус'],a.map(r=>[r.id,r.date,cname(r.center),r.channel,r.kind==='visit'?'Визит':r.kind==='product'?'Продукт':'',r.nps,r.rating,r.admin,r.expert,products.find(p=>p.id===r.product)?.sku||'',r.tags.join(', '),r.text,r.status]))}
function currentFeedback(){return S.feedback.find(x=>x.id===activeId)}function currentTicket(){return S.tickets.find(x=>x.id===activeId)}
function formOK(id){return $('#'+id)?.reportValidity()}
function addEvent(obj,title,text=''){obj.history.push({at:S.now,title,text})}
function makeRecord(overrides={}){return {id:'F'+String(Math.max(480,...S.feedback.map(r=>Number(r.id.slice(1))||0))+1).padStart(4,'0'),name:'Тестовый клиент',center:scopeCenter()||'C01',channel:'QR',date:S.now,kind:'visit',nps:8,rating:null,admin:4,expert:5,product:null,stage:'Завершение визита',tags:['Сервис'],text:'Тестовый ответ из прототипа.',status:'Новый',reply:'',history:[{at:S.now,title:'Ответ получен',text:'Локальная демонстрация'}],...overrides}}
const mutationActions=new Set(['new-feedback','save-feedback','ticket-from-feedback','new-ticket','save-new-ticket','save-ticket','save-tags','mark-reviewed','ai-reply','save-reply','add-note','ticket-reply','repeat-survey','repeat-score','submit-survey','new-action','save-action','new-check','save-check','validate-check']);
const adminActions=new Set(['save-survey','save-rules','save-templates','advance-time','reset','confirm-reset','import-demo','save-channel','sync-channel','restore-confirm']);
async function handleAction(action,b){if(mutationActions.has(action)&&!canEdit()){toast('Эта роль доступна только для просмотра.');return false}if(adminActions.has(action)&&!isAdmin()){toast('Настройки доступны руководителю CX.');return false}
switch(action){
case 'close':if(tourActive)stopTour();closeModal();break;
case 'menu':$('#sidebar').classList.toggle('open');$('#mobileBackdrop').classList.toggle('open');break;
case 'go-overview':navigate('overview');break;case 'go-inbox':navigate('inbox');break;case 'go-tickets':navigate('tickets');break;case 'go-nps':npsKind='visit';navigate('nps');break;case 'go-reports':navigate('reports');break;
case 'overdue':navigate('tickets');statusFilter='overdue';render();break;
case 'clear':F={period:'30',center:'',channel:''};q='';sentiment='';statusFilter='';page=0;render();break;
case 'next':page++;render();break;case 'prev':page=Math.max(0,page-1);render();break;
case 'new-feedback':newFeedback();break;
case 'save-feedback':{if(!formOK('newFeedbackForm'))return false;const ch=$('#newSource').value,r=makeRecord({channel:ch,center:$('#newCenter').value,kind:null,nps:null,admin:null,expert:null,rating:Number($('#newRating').value),tags:[$('#newTheme').value],text:$('#newText').value.trim()});if(!r.text){$('#newText').focus();return false}addFeedback(r);closeModal();navigate('inbox');toast('Отзыв добавлен. Правила обработки выполнены.');break}
case 'ticket-from-feedback':ticketForm(activeId);break;
case 'new-ticket':ticketForm();break;
case 'save-new-ticket':{if(!formOK('ticketCreate'))return false;const r=S.feedback.find(x=>x.id===activeId),subject=$('#ticketSubject').value.trim(),owner=$('#ticketOwner').value,priority=$('#ticketPriority').value,c=$('#ticketCenter').value,desc=$('#ticketDescription').value.trim();if(!subject||!desc)return false;const t=createTicket(r,subject,owner,priority);if(!r)t.center=c;addEvent(t,'Описание',desc);save();render();ticketModal(t.id);toast('Обращение '+t.id+' создано');break}
case 'save-ticket':{const t=currentTicket(),next=$('#editStatus').value,res=$('#resolution').value.trim(),due=$('#editDue').value;if(next==='Решено'&&!res){$('#resolutionError').textContent='Опишите результат решения, чтобы закрыть обращение.';$('#resolution').focus();return false}if(!due||!Number.isFinite(Date.parse(due+'Z'))){toast('Укажите корректный срок решения.');return false}const old=t.status;t.owner=$('#editOwner').value;t.status=next;t.priority=$('#editPriority').value;t.due=new Date(due+'Z').toISOString();t.resolution=res;t.resolved=next==='Решено'?(t.resolved||S.now):null;addEvent(t,old!==next?old+' → '+next:'Параметры обновлены','Ответственный: '+t.owner+(res?'. '+res:''));log('Обновлено '+t.id,next);render();ticketModal(t.id);toast('Изменения сохранены');break}
case 'save-tags':{const r=currentFeedback();r.tags=$$('#feedbackTags input:checked').map(x=>x.value);addEvent(r,'Темы обновлены',r.tags.join(', '));save();render();feedbackModal(r.id);toast('Темы сохранены');break}
case 'mark-reviewed':{const r=currentFeedback();r.status='Разобран';addEvent(r,'Отзыв разобран');save();render();feedbackModal(r.id);toast('Отметка сохранена');break}
case 'ai-reply':{const r=currentFeedback();$('#replyText').value=negative(r)?S.settings.negTemplate+' '+(r.tags.includes('Запись и ожидание')?'Отдельно проверим, как предупреждаем об изменении времени консультации.':''):S.settings.positiveTemplate;toast('Черновик по шаблону готов. Проверьте формулировки.');break}
case 'save-reply':{const r=currentFeedback(),reply=$('#replyText').value.trim();if(!reply){toast('Введите текст ответа.');$('#replyText').focus();return false}r.reply=reply;r.status='Ответ подготовлен';addEvent(r,'Ответ сохранён в демо',reply);log('Ответ для '+r.id,'Не отправлен во внешний канал');save();render();feedbackModal(r.id);toast('Ответ сохранён локально. Ничего не отправлено.');break}

,'primary')}</div>`)}catch{toast('Файл не подходит. Выберите JSON, сохранённый этим прототипом.')}}

{route:'reports',target:'[data-tour="report"]',title:'Результат для руководителя',text:'Отчёт отражает выбранную выборку и план действий. CSV действительно скачивается, PDF сохраняется через печать браузера.'},

];
function welcome(){openModal('Знакомство со Спектрой',`<div class="welcome"><div class="welcome-mark">${icon('qr')}${icon('arrow')}${icon('ticket')}${icon('arrow')}${icon('chart')}</div><div class="eyebrow">GELTEK / CUSTOMER EXPERIENCE</div><h2>От оценки клиента<br>к понятному действию</h2><p>Пройдите путь от отзыва о визите до решения обращения. Затем посмотрите NPS, проверки тайного покупателя и общую аналитику.</p><div class="welcome-list"><span><b>01</b>Собрать обратную связь</span><span><b>02</b>Решить проблему</span><span><b>03</b>Проверить результат</span></div><div class="notice">${icon('info')}<div>Все данные синтетические. Изменения сохраняются в этом браузере. Сообщения и подключения имитируются.</div></div><div class="form-actions">${btn('Посмотрю самостоятельно','tour-later')}${btn(icon('play')+' Начать экскурсию','tour-new','primary')}</div></div>`)}
function startTour(force=false){if(tourActive)return;if(!force&&S.tour.index>0&&!S.tour.seen){openModal('Продолжить экскурсию?',`<p>Вы остановились на шаге ${S.tour.index+1} из ${tourSteps.length}.</p><div class="form-actions">${btn('Начать заново','tour-new')}${btn('Продолжить','tour-resume','primary')}</div>`);return}beginTour(0)}
function beginTour(i){tourRole=S.role;S.role='Руководитель CX';F={period:'90',center:'',channel:''};tourActive=true;tourIndex=i;showTourStep()}
function clearTourTarget(){if(tourTarget){tourTarget.classList.remove('tour-target');tourTarget.removeAttribute('aria-describedby')}tourTarget=null}
function detachTourPanel(){
 const root=$('#tourRoot');
 const dialog=root.parentElement;
 if(dialog.id==='dialog')dialog.classList.remove('tour-docked','tour-survey');
 document.body.append(root);
}
function showTourStep(){
 const token=++tourToken;
 clearTourTarget();
 detachTourPanel();
 const root=$('#tourRoot');
 root.innerHTML='';
 const step=tourSteps[tourIndex];
 S.tour.index=tourIndex;S.tour.seen=false;save();
 if(step.route)navigate(step.route);
 if(step.before)step.before();
 requestAnimationFrame(()=>{
  if(token!==tourToken||!tourActive)return;
  const target=$(step.target);
  const dialog=target?.closest('dialog[open]')||(!target?$('dialog[open]'):null);
  if(dialog){
   dialog.classList.add('tour-docked');
   if(step.showSurvey&&target)dialog.classList.add('tour-survey');
   dialog.append(root);
  }
  tourTarget=target;
  target?.classList.add('tour-target');
  const currentStep=target?step:{title:'Вернёмся к сценарию',text:'Этот экран изменился. Можно перейти к следующему шагу.'};
  placeTour(target,currentStep,!!dialog);
  if(step.showSurvey&&target){
   $('.dialog-body',dialog).scrollTop=0;
   $('.tour-tip h3').focus({preventScroll:true});
  }else{
   target?.scrollIntoView({block:'center',behavior:'instant'});
   if(!dialog)positionTour(target);
   if(step.action&&target?.matches('button,input,select,textarea'))target.focus({preventScroll:true});
   else $('.tour-tip [data-action="tour-next"]')?.focus({preventScroll:true});
  }
 });
}
// Floating tips are used on workspace pages. Modal tips have their own layout area.
function tourLayout(bounds,target,width,height,preserveTarget=false){
 const gap=16,margin=12,leftEdge=bounds.left+margin,topEdge=bounds.top+margin;
 const rightEdge=bounds.right-margin,bottomEdge=bounds.bottom-margin;
 const w=Math.min(width,Math.max(1,rightEdge-leftEdge));
 let maxHeight=Math.max(1,bottomEdge-topEdge),h=Math.min(height,maxHeight);
 const clamp=(v,min,max)=>Math.max(min,Math.min(v,Math.max(min,max)));
 let left,top;
 if(rightEdge-target.right>=w+gap){left=target.right+gap;top=target.top}
 else if(target.left-leftEdge>=w+gap){left=target.left-gap-w;top=target.top}
 else{left=target.left;const below=bottomEdge-target.bottom,above=target.top-topEdge;
  if(below>=h+gap)top=target.bottom+gap;
  else if(above>=h+gap)top=target.top-gap-h;
  else if(preserveTarget&&Math.max(below,above)>=140){
   // A scrollable tip leaves the highlighted action unobstructed on short screens.
   maxHeight=Math.max(below,above)-gap;h=Math.min(h,maxHeight);
   top=below>=above?target.bottom+gap:target.top-gap-h;
  }else top=below>=above?bottomEdge-h:topEdge;
 }
 return {left:clamp(left,leftEdge,rightEdge-w),top:clamp(top,topEdge,bottomEdge-h),width:w,maxHeight};
}
function positionTour(target){
 const tip=$('.tour-tip'),hole=$('.tour-hole');if(!tip||!target?.isConnected||target.closest('dialog[open]'))return;
 const vv=window.visualViewport,view={left:vv?.offsetLeft||0,top:vv?.offsetTop||0,right:(vv?.offsetLeft||0)+(vv?.width||innerWidth),bottom:(vv?.offsetTop||0)+(vv?.height||innerHeight)};
 const bounds=view;
 const r=target.getBoundingClientRect(),width=Math.min(350,Math.max(1,bounds.right-bounds.left-24));
 tip.style.width=width+'px';tip.style.maxHeight=Math.max(1,bounds.bottom-bounds.top-24)+'px';
 const layout=tourLayout(bounds,r,width,tip.getBoundingClientRect().height,!!tourSteps[tourIndex]?.action);
 tip.style.maxHeight=layout.maxHeight+'px';tip.style.left=layout.left+'px';tip.style.top=layout.top+'px';
 if(hole){const l=Math.max(bounds.left+2,r.left-5),t=Math.max(bounds.top+2,r.top-5),right=Math.min(bounds.right-2,r.right+5),bottom=Math.min(bounds.bottom-2,r.bottom+5);
  hole.style.left=l+'px';hole.style.top=t+'px';hole.style.width=Math.max(0,right-l)+'px';hole.style.height=Math.max(0,bottom-t)+'px';
 }
}
function placeTour(target,step,docked){
 const root=$('#tourRoot');
 const progress=`<div class="tour-progress" aria-hidden="true">${tourSteps.map((_,i)=>`<i class="${i<=tourIndex?'done':''}"></i>`).join('')}</div>`;
 const controls=`<div class="tour-controls">
  ${btn('Назад','tour-back','small',tourIndex===0?'disabled':'')}
  ${step.action?btn('Пропустить шаг','tour-next','small'):btn(tourIndex===tourSteps.length-1?'Готово':'Далее','tour-next','small primary')}
 </div>`;
 const intro=`<div class="tour-tip-head row between">
  <span class="eyebrow" style="margin:0">Шаг ${tourIndex+1} / ${tourSteps.length}</span>
  <button class="link small" data-action="tour-stop">Завершить</button>
 </div>`;
 const title=`<h3 tabindex="-1">${step.title}</h3>`;
 const copy=`<p id="tourInstruction">${step.text}</p>`;
 const cue=step.action&&!step.showSurvey?'<div class="tour-cue">Ваше действие: нажмите выделенную кнопку.</div>':'';
 if(docked){
  root.innerHTML=`<section class="tour-tip" role="region" aria-label="Экскурсия: ${esc(step.title)}">
   ${intro}
   <div class="tour-copy" id="tourCopy">${title}${copy}${cue}</div>
   ${step.showSurvey?btn('К кнопке отправки','tour-find-action','small soft'):''}
   ${controls}
   <button class="link small tour-toggle" data-action="tour-toggle" aria-controls="tourCopy" aria-expanded="true">Свернуть пояснение</button>
  </section>`;
 }else{
  root.innerHTML=`${target?'<div class="tour-hole"></div>':''}<section class="tour-tip" role="dialog" aria-label="Экскурсия: ${esc(step.title)}" style="top:12px;left:12px">
   ${intro}${title}${copy}${cue}${progress}${controls}
  </section>`;
 }
 target?.setAttribute('aria-describedby','tourInstruction');
}
let tourPositionFrame=0;
function queueTourPosition(){if(!tourActive||!tourTarget?.isConnected||tourPositionFrame)return;tourPositionFrame=requestAnimationFrame(()=>{tourPositionFrame=0;if(tourActive)positionTour(tourTarget)})}

function advanceTour(){if(!tourActive)return;if(tourIndex<tourSteps.length-1){tourIndex++;showTourStep()}else finishTour()}
function stopTour(notify=true){tourToken++;clearTourTarget();tourActive=false;const root=$('#tourRoot');if(root){root.innerHTML='';detachTourPanel()}S.tour.index=tourIndex;save();if(notify)toast('Экскурсия приостановлена. Продолжите кнопкой вверху.')}
function finishTour(){stopTour(false);S.tour.seen=true;S.tour.index=0;save();openModal('Вы прошли основные сценарии',`<div class="welcome"><div class="welcome-mark">${icon('check')}${icon('chart')}</div><h2>Теперь можно исследовать систему</h2><p>Вы обработали отзыв, создали обращение, проверили повторный опрос и добавили ответ клиента. Все изменения остались в демонстрации.</p><p>Для следующей встречи исходные данные можно вернуть в разделе «Настройки». Внедрение и реальные подключения требуют отдельного согласования.</p><div class="form-actions">${btn('Продолжить самостоятельно','close','primary')}</div></div>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tourActive){e.preventDefault();stopTour();return}if(e.key==='Tab'&&tourActive){const tip=$('.tour-tip');if(!tip||tip.closest('dialog[open]'))return;const nodes=[...(tourSteps[tourIndex].action&&tourTarget?.matches('button,input,select,textarea')?[tourTarget]:[]),...$$('button:not([disabled])',tip)];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#dialog').addEventListener('cancel',e=>{if(tourActive){e.preventDefault();stopTour()}else closeModal()});
window.addEventListener('resize',queueTourPosition);
document.addEventListener('scroll',queueTourPosition,true);
window.visualViewport?.addEventListener('resize',queueTourPosition);
window.visualViewport?.addEventListener('scroll',queueTourPosition);
$('#mobileBackdrop').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobileBackdrop').classList.remove('open')});
render();save();if(!S.tour.seen&&S.tour.index===0)setTimeout(welcome,150);
})();
</script></body></html>
